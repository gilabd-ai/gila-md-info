<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{PAGE_TITLE}}</title>
{{SEO_META_TAGS}}
{{JSONLD_SCRIPT}}
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#20302c;
    --paper:#f6f3ec;
    --paper-raised:#ffffff;
    --teal:#1f4d46;
    --teal-deep:#123230;
    --blush:#e0785f;
    --blush-deep:#c65f48;
    --line: rgba(32,48,44,0.12);
    --shadow: 0 8px 24px rgba(18,50,48,0.12);
    --radius: 14px;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter', sans-serif;
    -webkit-font-smoothing:antialiased;
    padding-top: 156px; /* space for the fixed header+home-nav-bar stack — must match .site-header-fixed's real rendered height, same as Node pages */
  }
  h1,h2,h3, .display{
    font-family:'Rubik', sans-serif;
    font-weight:500;
    letter-spacing:-0.01em;
  }
  a{ color:inherit; }

  /* ---------- Fixed header stack (identical to Knowledge Node pages) ---------- */
  .site-header-fixed{
    position:fixed;
    top:0; left:0; right:0;
    z-index:200;
  }
  .home-nav-bar{
    display:flex;
    align-items:center;
    gap:10px;
    padding:18px 16px;
    background: rgba(242,90,166,0.10);
    border-bottom: 1px solid rgba(242,90,166,0.25);
    font-size:18px;
    font-weight:700;
    color: rgba(216,64,142,0.95);
    text-decoration:none;
  }
  .home-nav-bar svg{ width:26px; height:26px; flex:none; }

  /* ---------- Sticky Header (identical to Knowledge Node header) ---------- */
  header.node-header{
    position:relative;
    min-height:90px;
    background: linear-gradient(135deg, rgba(242,90,166,0.90), rgba(216,64,142,0.90));
    color:#ffffff;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:12px 16px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.2);
  }
  .header-logo{
    position:absolute; top:50%; right:16px; transform:translateY(-50%);
    width:56px; height:56px; border-radius:50%; object-fit:cover;
    background:#fff; box-shadow: 0 2px 6px rgba(0,0,0,0.15);
  }
  .header-title-line{
    font-family:'Rubik', sans-serif; font-size:26px; font-weight:700; line-height:1.3;
    text-align:center; width:100%;
  }

  /* ---------- Layout ---------- */
  main{ max-width:640px; margin:0 auto; padding: 20px 16px 56px; }

  .page-title{
    font-size:22px; font-weight:700; line-height:1.3; margin:0 0 20px; color:var(--teal-deep);
  }

  /* ---------- Topic tiles ---------- */
  .topics-grid{
    display:grid;
    grid-template-columns: repeat(2, 1fr);
    gap:12px;
    margin-bottom:30px;
  }
  .topic-tile{
    background:var(--paper-raised);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:18px 16px;
    text-decoration:none;
    color:inherit;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    gap:6px;
    box-shadow: none;
    transition: box-shadow 0.15s ease;
  }
  .topic-tile:hover{ box-shadow: var(--shadow); }
  .topic-tile-name{
    font-size:15px; font-weight:700; color:var(--teal-deep); margin:0; line-height:1.35;
  }
  .topic-tile-count{
    font-size:12.5px; color:#5c6b64; margin:0;
  }

  .empty-state{
    background:var(--paper-raised);
    border:1px dashed var(--line);
    border-radius:var(--radius);
    padding:24px 18px;
    text-align:center;
    color:#5c6b64;
    font-size:14px;
    margin-bottom:30px;
  }

  /* ---------- Back-to-previous-page button (see template.html for the
     full rationale — identical treatment on every page type) ---------- */
  .back-link{
    display:none;
    align-items:center;
    justify-content:center;
    gap:8px;
    width:fit-content;
    min-width:225px;
    line-height:1;
    margin:0 auto 30px;
    padding:14px 32px;
    border-radius:12px;
    background: rgba(242,90,166,0.10);
    border: 1px solid rgba(242,90,166,0.25);
    color: rgba(216,64,142,0.95);
    font-family:'Inter', sans-serif;
    font-size:15px;
    font-weight:600;
    cursor:pointer;
    transition: background 0.15s ease;
  }
  .back-link.show{ display:flex; }
  .back-link:hover{ background: rgba(242,90,166,0.18); }
  .back-link svg{ width:18px; height:18px; flex:none; }

  .site-disclaimer{
    font-family:'Inter', sans-serif;
    font-size:12.5px;
    font-weight:400;
    color:#5c6b64;
    line-height:1.6;
    margin:28px 0 4px;
    display:block;
    text-decoration:none;
  }
  .disclaimer-underline{ text-decoration:underline; }
</style>
</head>
<body>

<div class="site-header-fixed">
<header class="node-header">
  <img class="header-logo" src="data:image/png;base64,{{SITE_LOGO_BASE64}}" alt="Gila MD logo">
  <div class="header-title-line">{{SITE_HEADER_TITLE_LINE1}}</div>
  <div class="header-title-line">{{SITE_HEADER_TITLE_LINE2}}</div>
</header>
<a class="home-nav-bar" href="{{HOME_NAV_URL}}">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
  {{HOME_NAV_TEXT}}
</a>
</div>

<main>
  <h1 class="page-title">{{TOPICS_INDEX_HEADING}}</h1>

{{TOPICS_LIST_HTML}}

  <button type="button" id="backLinkBtn" class="back-link" onclick="history.back()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 5l7 7-7 7"/></svg>
    {{UI_BACK_BUTTON_TEXT}}
  </button>
  <script>
    try {
      if (document.referrer && document.referrer.indexOf(location.origin) === 0 && window.history.length > 1){
        document.getElementById('backLinkBtn').classList.add('show');
      }
    } catch (e) {}
  </script>

  <a class="site-disclaimer" href="{{DISCLAIMER_LINK_URL}}">{{DISCLAIMER_ICON}} {{DISCLAIMER_SHORT_TEXT}} <span class="disclaimer-underline">{{DISCLAIMER_LINK_PREFIX}} {{DISCLAIMER_LINK_TEXT}}</span>.</a>
</main>

</body>
</html>

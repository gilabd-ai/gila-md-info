<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{PAGE_TITLE}}</title>
{{SEO_META_TAGS}}
{{JSONLD_SCRIPT}}
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#20302c;
    --paper:#f6f3ec;
    --paper-raised:#ffffff;
    --teal:#1f4d46;
    --teal-deep:#123230;
    --blush:#e0785f;
    --blush-deep:#c65f48;
    --line: rgba(32,48,44,0.12);
    --shadow: 0 8px 24px rgba(18,50,48,0.12);
    --radius: 14px;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter', sans-serif;
    -webkit-font-smoothing:antialiased;
    padding-top: 114px; /* PROTOTYPE (All Topics page only): shorter 72px header + slimmer ~41px nav bar — see below. Not shared with other pages. */
  }
  h1,h2,h3, .display{
    font-family:'Rubik', sans-serif;
    font-weight:500;
    letter-spacing:-0.01em;
  }
  a{ color:inherit; }

  /* =========================================================================
     PROTOTYPE — All Topics page ONLY. This header/nav block is a temporary,
     isolated experiment (shorter header + hamburger menu) and is NOT shared
     with any other page. Nothing here has been promoted to template.html,
     homepage-template.html, topic-template.html, or disclaimer-template.html.
     Easy to delete wholesale if the experiment is rejected; easy to promote
     into the shared header later if approved.
     ========================================================================= */
  .site-header-fixed{
    position:fixed;
    top:0; left:0; right:0;
    z-index:200;
  }
  .home-nav-bar{
    display:flex;
    align-items:center;
    justify-content:flex-start; /* right-aligned: main-start = right in this RTL page */
    gap:8px;
    padding:12px 16px; /* horizontal 16px matches main's own side padding below */
    background: rgba(242,90,166,0.10);
    border-bottom: 1px solid rgba(242,90,166,0.25);
    font-size:12px;
    font-weight:700;
    color: rgba(216,64,142,0.95);
    text-decoration:none;
  }
  .home-nav-bar svg{ width:16px; height:16px; flex:none; }

  header.node-header{
    position:relative;
    min-height:72px;
    background: linear-gradient(135deg, rgba(242,90,166,0.90), rgba(216,64,142,0.90));
    color:#ffffff;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:8px 16px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.2);
  }
  .header-logo{
    position:absolute; top:50%; left:16px; transform:translateY(-50%);
    width:48px; height:48px; border-radius:50%; object-fit:cover;
    background:#fff; box-shadow: 0 2px 6px rgba(0,0,0,0.15);
  }
  .header-title-line{
    font-family:'Rubik', sans-serif; font-size:23px; font-weight:700; line-height:1.22;
    text-align:center; width:100%;
  }
  .proto-hamburger{
    position:absolute; top:50%; right:8px; transform:translateY(-50%);
    width:48px; height:48px;
    display:flex; align-items:center; justify-content:center;
    background:none; border:none; padding:0; margin:0;
    color:#ffffff; cursor:pointer;
  }
  .proto-hamburger svg{ width:26px; height:26px; }
  .proto-hamburger:focus-visible{
    outline:2px solid #ffffff; outline-offset:-3px; border-radius:8px;
  }

  /* ---------- Topic Selector modal (ported as-is from the Homepage's
     progressive-enhancement modal — same markup/CSS/JS, same data source
     via the hidden native <select> below. See homepage-template.html for
     the canonical version and full rationale; this is a duplicate for
     prototype isolation, not a new navigation system.) ---------- */
  .topic-selector-native{
    position:absolute;
    width:1px; height:1px;
    overflow:hidden;
    clip:rect(0,0,0,0);
    white-space:nowrap;
  }
  .topic-modal-overlay{
    position:fixed;
    inset:0;
    background:rgba(18,50,48,0.45);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:16px;
    z-index:500;
  }
  .topic-modal-overlay[hidden]{ display:none; }
  .topic-modal-dialog{
    direction:rtl;
    display:flex;
    flex-direction:column;
    width:90vw;
    max-width:600px;
    max-height:75vh;
    background:var(--paper);
    border:1px solid rgba(242,90,166,0.35);
    border-radius:var(--radius);
    box-shadow: 0 20px 50px rgba(18,50,48,0.30);
    overflow:hidden;
  }
  .topic-modal-header{
    flex:none;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    padding:18px 20px;
    border-bottom:1px solid var(--line);
    background:var(--paper);
  }
  .topic-modal-title{ margin:0; font-size:18px; color:var(--teal-deep); text-align:right; }
  .topic-modal-close{
    flex:none; width:36px; height:36px; border-radius:50%; border:none;
    background:rgba(242,90,166,0.12); color:var(--blush-deep);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; transition:background 0.15s ease;
  }
  .topic-modal-close:hover{ background:rgba(242,90,166,0.22); }
  .topic-modal-close:focus-visible{ outline:2px solid var(--blush-deep); outline-offset:2px; }
  .topic-modal-close svg{ width:16px; height:16px; }
  .topic-modal-list{ list-style:none; margin:0; padding:10px 12px 18px; overflow-y:auto; }
  .topic-modal-row{
    display:block; width:100%; padding:14px 12px; border-radius:10px;
    text-align:right; color:var(--ink); text-decoration:none; font-size:15px;
    transition:background 0.12s ease;
  }
  .topic-modal-row:hover{ background:rgba(242,90,166,0.10); }
  .topic-modal-row:focus-visible{
    outline:2px solid var(--blush-deep); outline-offset:-2px; background:rgba(242,90,166,0.10);
  }
  .topic-modal-row:active{ background:rgba(242,90,166,0.18); }
  /* ---------- end ported Topic Selector modal ---------- */

  /* ---------- Layout ---------- */
  main{ max-width:640px; margin:0 auto; padding: 20px 16px 56px; }

  .page-title{
    font-size:22px; font-weight:700; line-height:1.3; margin:0 0 20px; color:var(--teal-deep);
  }

  /* ---------- Topic tiles ---------- */
  .topics-grid{
    display:grid;
    grid-template-columns: repeat(2, 1fr);
    gap:12px;
    margin-bottom:30px;
  }
  .topic-tile{
    background:var(--paper-raised);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:18px 16px;
    text-decoration:none;
    color:inherit;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    gap:6px;
    box-shadow: none;
    transition: box-shadow 0.15s ease;
  }
  .topic-tile:hover{ box-shadow: var(--shadow); }
  .topic-tile-name{
    font-size:15px; font-weight:700; color:var(--teal-deep); margin:0; line-height:1.35;
  }
  .topic-tile-count{
    font-size:12.5px; color:#5c6b64; margin:0;
  }

  .empty-state{
    background:var(--paper-raised);
    border:1px dashed var(--line);
    border-radius:var(--radius);
    padding:24px 18px;
    text-align:center;
    color:#5c6b64;
    font-size:14px;
    margin-bottom:30px;
  }

  /* ---------- Back-to-previous-page button (see template.html for the
     full rationale — identical treatment on every page type) ---------- */
  .back-link{
    display:none;
    align-items:center;
    justify-content:center;
    gap:8px;
    width:fit-content;
    min-width:225px;
    line-height:1;
    margin:0 auto 30px;
    padding:14px 32px;
    border-radius:12px;
    background: rgba(242,90,166,0.10);
    border: 1px solid rgba(242,90,166,0.25);
    color: rgba(216,64,142,0.95);
    font-family:'Inter', sans-serif;
    font-size:15px;
    font-weight:600;
    cursor:pointer;
    transition: background 0.15s ease;
  }
  .back-link.show{ display:flex; }
  .back-link:hover{ background: rgba(242,90,166,0.18); }
  .back-link svg{ width:18px; height:18px; flex:none; }

  .site-disclaimer{
    font-family:'Inter', sans-serif;
    font-size:12.5px;
    font-weight:400;
    color:#5c6b64;
    line-height:1.6;
    margin:28px 0 4px;
    display:block;
    text-decoration:none;
  }
  .disclaimer-underline{ text-decoration:underline; }
</style>
</head>
<body>

<!-- PROTOTYPE (All Topics page only): 72px header, hamburger opens the same
     Topic Selector modal used on the Homepage, reusing the same active-Topic
     data via this hidden <select>. See CSS block above for full context. -->
<select id="topicSelector" class="topic-selector-native" aria-hidden="true" tabindex="-1">
  <option value="" disabled selected>{{TOPIC_SELECTOR_PLACEHOLDER}}</option>
{{TOPIC_SELECTOR_OPTIONS_HTML}}
</select>

<div class="site-header-fixed">
<header class="node-header">
  <button type="button" id="topicSelectorTrigger" class="proto-hamburger" aria-haspopup="dialog" aria-label="{{TOPIC_SELECTOR_LABEL}}">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
  </button>
  <div class="header-title-line">{{SITE_HEADER_TITLE_LINE1}}</div>
  <div class="header-title-line">{{SITE_HEADER_TITLE_LINE2}}</div>
  <img class="header-logo" src="data:image/png;base64,{{SITE_LOGO_BASE64}}" alt="Gila MD logo">
</header>
<a class="home-nav-bar" href="{{HOME_NAV_URL}}">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
  {{HOME_NAV_TEXT}}
</a>
</div>

<div id="topicModalOverlay" class="topic-modal-overlay" hidden>
  <div id="topicModalDialog" class="topic-modal-dialog" role="dialog" aria-modal="true" aria-labelledby="topicModalTitle">
    <div class="topic-modal-header">
      <h2 id="topicModalTitle" class="topic-modal-title">{{TOPIC_MODAL_TITLE}}</h2>
      <button type="button" id="topicModalClose" class="topic-modal-close" aria-label="{{TOPIC_MODAL_CLOSE_ARIA}}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <ul id="topicModalList" class="topic-modal-list" aria-label="{{TOPIC_SELECTOR_LABEL}}"></ul>
  </div>
</div>
<script>
  // ---- Topic Selector modal (ported as-is from the Homepage's
  // progressive-enhancement modal; see homepage-template.html for the
  // canonical version). Rows are built from this page's own hidden
  // <select> options — same data, no new navigation system. ----
  (function(){
    const nativeSelect = document.getElementById('topicSelector');
    const trigger = document.getElementById('topicSelectorTrigger');
    const overlay = document.getElementById('topicModalOverlay');
    const dialog = document.getElementById('topicModalDialog');
    const closeBtn = document.getElementById('topicModalClose');
    const listEl = document.getElementById('topicModalList');
    if (!nativeSelect || !trigger || !overlay || !dialog || !closeBtn || !listEl) return;

    const options = Array.from(nativeSelect.options).filter(function(o){ return o.value; });
    if (options.length === 0) return;

    options.forEach(function(opt){
      const li = document.createElement('li');
      const a = document.createElement('a');
      a.className = 'topic-modal-row';
      a.href = opt.value;
      a.textContent = opt.textContent;
      li.appendChild(a);
      listEl.appendChild(li);
    });

    let lastFocused = null;
    let previousBodyOverflow = '';

    function getFocusable(){
      return Array.from(dialog.querySelectorAll('a[href], button:not([disabled])'));
    }

    function onKeydown(e){
      if (e.key === 'Escape'){
        e.preventDefault();
        closeModal();
        return;
      }
      if (e.key === 'Tab'){
        const focusable = getFocusable();
        if (focusable.length === 0) return;
        const first = focusable[0];
        const last = focusable[focusable.length - 1];
        if (e.shiftKey && document.activeElement === first){
          e.preventDefault();
          last.focus();
        } else if (!e.shiftKey && document.activeElement === last){
          e.preventDefault();
          first.focus();
        }
      }
    }

    function openModal(){
      lastFocused = document.activeElement;
      overlay.hidden = false;
      previousBodyOverflow = document.body.style.overflow;
      document.body.style.overflow = 'hidden';
      document.addEventListener('keydown', onKeydown);
      closeBtn.focus();
    }

    function closeModal(){
      overlay.hidden = true;
      document.body.style.overflow = previousBodyOverflow;
      document.removeEventListener('keydown', onKeydown);
      if (lastFocused && typeof lastFocused.focus === 'function') lastFocused.focus();
    }

    trigger.addEventListener('click', openModal);
    closeBtn.addEventListener('click', closeModal);
  })();
</script>

<main>
  <h1 class="page-title">{{TOPICS_INDEX_HEADING}}</h1>

{{TOPICS_LIST_HTML}}

  <button type="button" id="backLinkBtn" class="back-link" onclick="history.back()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 5l7 7-7 7"/></svg>
    {{UI_BACK_BUTTON_TEXT}}
  </button>
  <script>
    try {
      if (document.referrer && document.referrer.indexOf(location.origin) === 0 && window.history.length > 1){
        document.getElementById('backLinkBtn').classList.add('show');
      }
    } catch (e) {}
  </script>

  <a class="site-disclaimer" href="{{DISCLAIMER_LINK_URL}}">{{DISCLAIMER_ICON}} {{DISCLAIMER_SHORT_TEXT}} <span class="disclaimer-underline">{{DISCLAIMER_LINK_PREFIX}} {{DISCLAIMER_LINK_TEXT}}</span>.</a>
</main>

</body>
</html>

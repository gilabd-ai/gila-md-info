<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{PAGE_TITLE}}</title>
{{SEO_META_TAGS}}
{{JSONLD_SCRIPT}}
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#20302c;
    --paper:#f6f3ec;
    --paper-raised:#ffffff;
    --teal:#1f4d46;
    --teal-deep:#123230;
    --blush:#e0785f;
    --blush-deep:#c65f48;
    --line: rgba(32,48,44,0.12);
    --shadow: 0 8px 24px rgba(18,50,48,0.12);
    --radius: 14px;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter', sans-serif;
    -webkit-font-smoothing:antialiased;
    padding-top: 156px; /* space for the fixed header+home-nav-bar stack — must match .site-header-fixed's real rendered height, same as Node pages */
  }
  h1,h2,h3, .display{
    font-family:'Rubik', sans-serif;
    font-weight:500;
    letter-spacing:-0.01em;
  }
  a{ color:inherit; }

  /* ---------- Fixed header stack (identical to Knowledge Node pages) ---------- */
  .site-header-fixed{
    position:fixed;
    top:0; left:0; right:0;
    z-index:200;
  }
  .home-nav-bar{
    display:flex;
    align-items:center;
    gap:10px;
    padding:18px 16px;
    background: rgba(242,90,166,0.10);
    border-bottom: 1px solid rgba(242,90,166,0.25);
    font-size:18px;
    font-weight:700;
    color: rgba(216,64,142,0.95);
    text-decoration:none;
  }
  .home-nav-bar svg{ width:26px; height:26px; flex:none; }

  /* ---------- Sticky Header (identical to Knowledge Node header) ---------- */
  header.node-header{
    position:relative;
    min-height:90px;
    background: linear-gradient(135deg, rgba(242,90,166,0.90), rgba(216,64,142,0.90));
    color:#ffffff;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:12px 16px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.2);
  }
  .header-logo{
    position:absolute; top:50%; right:16px; transform:translateY(-50%);
    width:56px; height:56px; border-radius:50%; object-fit:cover;
    background:#fff; box-shadow: 0 2px 6px rgba(0,0,0,0.15);
  }
  .header-title-line{
    font-family:'Rubik', sans-serif; font-size:26px; font-weight:700; line-height:1.3;
    text-align:center; width:100%;
  }

  /* ---------- Layout ---------- */
  main{ max-width:640px; margin:0 auto; padding: 20px 16px 56px; }

  .page-title{
    font-size:22px; font-weight:700; line-height:1.3; margin:0 0 20px; color:var(--teal-deep);
  }

  .disclaimer-block{
    background:var(--paper-raised);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:20px 20px;
    margin-bottom:22px;
  }
  .disclaimer-block p{
    font-size:14.5px;
    line-height:1.75;
    margin:0 0 16px;
  }
  .disclaimer-block p:last-child{ margin-bottom:0; }
  .disclaimer-updated{
    font-size:12.5px;
    color:#5c6b64;
    margin:0 0 30px;
  }

  .home-return-link{
    display:flex;
    align-items:center;
    justify-content:center;
    width:fit-content;
    min-width:225px;
    margin:0 auto;
    padding:14px 32px;
    border-radius:12px;
    background: linear-gradient(135deg, rgba(242,90,166,0.90), rgba(216,64,142,0.90));
    color:#fff;
    font-size:15px;
    font-weight:600;
    text-decoration:none;
    transition:box-shadow 0.15s ease;
  }
  .home-return-link:hover{ box-shadow: 0 4px 14px rgba(0,0,0,0.2); }

  /* ---------- Nav-button group spacing (see template.html's
     .node-nav-buttons — same 14px value, the source of truth) ---------- */
  .nav-buttons-stack{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:14px;
  }

  /* ---------- Back-to-previous-page button (see template.html for the
     full rationale — identical treatment on every page type) ---------- */
  .back-link{
    display:none;
    align-items:center;
    justify-content:center;
    gap:8px;
    width:fit-content;
    min-width:225px;
    line-height:1;
    margin:0 auto;
    padding:14px 32px;
    border-radius:12px;
    background: rgba(242,90,166,0.10);
    border: 1px solid rgba(242,90,166,0.25);
    color: rgba(216,64,142,0.95);
    font-family:'Inter', sans-serif;
    font-size:15px;
    font-weight:600;
    cursor:pointer;
    transition: background 0.15s ease;
  }
  .back-link.show{ display:flex; }
  .back-link:hover{ background: rgba(242,90,166,0.18); }
  .back-link svg{ width:18px; height:18px; flex:none; }
</style>
</head>
<body>

<div class="site-header-fixed">
<header class="node-header">
  <img class="header-logo" src="data:image/png;base64,{{SITE_LOGO_BASE64}}" alt="Gila MD logo">
  <div class="header-title-line">{{SITE_HEADER_TITLE_LINE1}}</div>
  <div class="header-title-line">{{SITE_HEADER_TITLE_LINE2}}</div>
</header>
<a class="home-nav-bar" href="{{HOME_NAV_URL}}">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
  {{HOME_NAV_TEXT}}
</a>
</div>

<main>
  <h1 class="page-title">{{DISCLAIMER_PAGE_TITLE}}</h1>

  <div class="disclaimer-block">
{{DISCLAIMER_PARAGRAPHS_HTML}}
  </div>

  <p class="disclaimer-updated">{{DISCLAIMER_LAST_UPDATED}}</p>

  <div class="nav-buttons-stack">
    <button type="button" id="backLinkBtn" class="back-link" onclick="history.back()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 5l7 7-7 7"/></svg>
      {{UI_BACK_BUTTON_TEXT}}
    </button>
    <a class="home-return-link" href="{{ALL_TOPICS_BUTTON_URL}}">{{ALL_TOPICS_BUTTON_TEXT}}</a>
  </div>
  <script>
    try {
      if (document.referrer && document.referrer.indexOf(location.origin) === 0 && window.history.length > 1){
        document.getElementById('backLinkBtn').classList.add('show');
      }
    } catch (e) {}
  </script>
</main>

</body>
</html>
